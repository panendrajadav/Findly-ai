name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          FINDLY_EVAL_LOG: logs/ci-evals.jsonl
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t findly-ai:ci .
      - name: Smoke test container
        run: |
          docker run -d --name findly -p 8000:8000 findly-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs findly
          exit 1
