name: CI

on:
  push:
    branches-ignore: [eval-history]
  pull_request:

jobs:
  eval:
    name: Answer-quality eval (golden set)
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write   # publishes results to the eval-history branch
    concurrency:
      group: eval-history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load previous history
        run: |
          if git fetch -q origin eval-history 2>/dev/null; then
            git show origin/eval-history:eval-history.json > "$RUNNER_TEMP/eval-history.json"
          else
            echo "[]" > "$RUNNER_TEMP/eval-history.json"
          fi

      - name: Run golden-set eval
        run: |
          python scripts/run_eval.py \
            --output "$RUNNER_TEMP/latest-report.json" \
            --history "$RUNNER_TEMP/eval-history.json" \
            --min-accuracy 0.9

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            ${{ runner.temp }}/latest-report.json
            ${{ runner.temp }}/eval-history.json

      - name: Publish history to eval-history branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/eval-history; then
            git checkout -q -B eval-history origin/eval-history
          else
            git checkout -q --orphan eval-history
            git rm -rfq .
          fi
          cp "$RUNNER_TEMP/eval-history.json" eval-history.json
          cp "$RUNNER_TEMP/latest-report.json" latest-report.json
          git add eval-history.json latest-report.json
          ACC=$(python -c "import json;print(json.load(open('latest-report.json'))['accuracy'])")
          git commit -qm "eval: ${GITHUB_SHA::7} accuracy ${ACC}" || { echo "No change"; exit 0; }
          git push -q origin eval-history

  tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          FINDLY_EVAL_LOG: logs/ci-evals.jsonl
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t findly-ai:ci .
      - name: Smoke test container
        run: |
          docker run -d --name findly -p 8000:8000 findly-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs findly
          exit 1
